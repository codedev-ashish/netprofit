# Example mutations for the online services platform

# Upsert (update or insert) a user's info based on their auth.uid
mutation UpsertUser($email: String, $mobile: String, $username: String) @auth(level: USER) {
  user_upsert(data: { id_expr: "auth.uid", email: $email, mobile: $mobile, username: $username })
}

# Add a Business
mutation AddBusiness($name: String!, $gstin: String, $pan: String) @auth(level: USER) {
  business_insert(data: { userId_expr: "auth.uid", name: $name, gstin: $gstin, pan: $pan })
}

# Create an Order for a service plan
mutation CreateOrder($businessId: UUID!, $servicePlanId: UUID!, $amount: Float!) @auth(level: USER) {
  order_insert(data: { userId_expr: "auth.uid", businessId: $businessId, servicePlanId: $servicePlanId, amount: $amount, paymentStatus: "Pending" })
}

# Create a Service Request linked to an order
mutation CreateServiceRequest($orderId: UUID!, $taxYear: String, $quarter: String, $month: String) @auth(level: USER) {
  serviceRequest_insert(data: { orderId: $orderId, status: "Pending", taxYear: $taxYear, quarter: $quarter, month: $month })
}

# Upload a Document (User or Admin)
mutation UploadDocument($serviceRequestId: UUID!, $uploaderType: String!, $fileName: String!, $fileUrl: String!, $fileType: String) @auth(level: USER) {
  document_insert(data: { serviceRequestId: $serviceRequestId, uploaderType: $uploaderType, fileName: $fileName, fileUrl: $fileUrl, fileType: $fileType })
}

# Update Service Request Status (Admin)
mutation UpdateServiceRequestStatus($id: UUID!, $status: String!, $expectedCompletionDate: Date) @auth(level: NO_ACCESS) {
  serviceRequest_update(id: $id, data: { status: $status, expectedCompletionDate: $expectedCompletionDate, updatedAt_expr: "request.time" })
}
