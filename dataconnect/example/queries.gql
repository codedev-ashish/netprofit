# Example queries for the online services platform

# Get all businesses for the logged-in user
query GetUserBusinesses @auth(level: USER) {
  businesses(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    name
    gstin
    pan
    createdAt
  }
}

# Get available services and their plans
query GetAvailableServices @auth(level: PUBLIC, insecureReason: "Services catalog is public") {
  services {
    id
    slug
    title
    description
    price
    imageUrl
    isActive
    plans: servicePlans_on_service {
      id
      planType
      periodTaggingType
      price
      isActive
    }
  }
}

# Get user's orders and tracking timeline
query GetUserServiceRequests @auth(level: USER) {
  orders(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    paymentStatus
    amount
    createdAt
    servicePlan {
      planType
      service {
        title
      }
    }
    business {
      name
    }
    requests: serviceRequests_on_order {
      id
      status
      taxYear
      quarter
      month
      expectedCompletionDate
      createdAt
      documents: documents_on_serviceRequest {
        id
        fileName
        fileUrl
        uploaderType
      }
    }
  }
}

# Get all service requests for admin view
query GetAllServiceRequests @auth(level: NO_ACCESS) {
  serviceRequests {
    id
    status
    taxYear
    quarter
    month
    expectedCompletionDate
    createdAt
    order {
      paymentStatus
      user {
        email
        username
      }
      business {
        name
      }
      servicePlan {
        planType
        service {
          title
        }
      }
    }
    documents: documents_on_serviceRequest {
      fileName
      fileUrl
      uploaderType
    }
  }
}
