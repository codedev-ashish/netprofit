# User table is keyed by Firebase Auth UID.
type User @table {
  id: String! @default(expr: "auth.uid")
  email: String
  mobile: String
  username: String @col(dataType: "varchar(50)")
}

type Business @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  name: String!
  gstin: String
  pan: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Service @table {
  slug: String! @unique
  title: String!
  description: String
  content: String
  price: Float
  imageUrl: String
  isActive: Boolean! @default(value: true)
}

type ServicePlan @table {
  id: UUID! @default(expr: "uuidV4()")
  service: Service!
  planType: String! # "One-time", "Quarterly", "Half-yearly", "Annual"
  periodTaggingType: String! # "None", "Annual", "Quarterly", "Monthly"
  price: Float!
  isActive: Boolean! @default(value: true)
}

type Order @table {
  id: UUID! @default(expr: "uuidV4()")
  user: User!
  business: Business!
  servicePlan: ServicePlan!
  paymentStatus: String! @default(value: "Pending") # "Pending", "Paid", "Failed"
  amount: Float!
  createdAt: Timestamp! @default(expr: "request.time")
}

type ServiceRequest @table {
  id: UUID! @default(expr: "uuidV4()")
  order: Order!
  status: String! @default(value: "Pending") # "Pending", "In Progress", "Completed"
  taxYear: String # e.g. "2024-25"
  quarter: String # e.g. "Q1", "Q2"
  month: String # e.g. "April 2025"
  expectedCompletionDate: Date
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Document @table {
  id: UUID! @default(expr: "uuidV4()")
  serviceRequest: ServiceRequest!
  uploaderType: String! # "User" or "Admin"
  fileName: String!
  fileUrl: String!
  fileType: String
  uploadedAt: Timestamp! @default(expr: "request.time")
}
